name: Release

# Bump "version" in custom_components/enocean_eltako/manifest.json and add its section to
# CHANGELOG.md: once Validate has passed for the push to main, the tag and the GitHub release
# are created (once per version).
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    # only a validated push to main; by hand only from main
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version custom_components/enocean_eltako/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists already."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Collect the release notes from the changelog
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          # the section of this version in each language, without its heading
          awk -v v="$version" '
            /^## /      { lang = $0; sub(/^## /, "", lang) }
            /^### \[/   { on = index($0, "[" v "]") > 0; if (on) print "## " lang; next }
            /^## /      { on = 0 }
            on          { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $version"
            exit 1
          fi
          cat notes.md
      - name: Create the release
        if: steps.version.outputs.exists != 'true'
        run: |
          version="$VERSION"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$version" --target "$SHA" --title "v$version" \
            --notes-file notes.md "${flags[@]}"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
