<!doctype html>
<!-- Preview of the sidebar panel without Home Assistant, with sample data (fake-hass.js).
     From the repository root: python3 -m http.server 8765
     then open http://localhost:8765/scripts/panel-preview/?lang=de (options: see fake-hass.js). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnOcean panel preview</title>
  <style>body { margin: 0; }</style>
</head>
<body>
<script type="module">
  import { fakeHass } from "./fake-hass.js";

  customElements.define("ha-menu-button", class extends HTMLElement {});
  // a new version on every reload, like the hash Home Assistant adds
  await import(`../../custom_components/enocean_eltako/frontend/monitor-panel.js?v=${Date.now()}`);
  const fake = fakeHass(new URLSearchParams(location.search));
  const panel = document.createElement("enocean-eltako-monitor");
  panel.narrow = false;
  document.body.append(panel);
  panel.hass = fake.hass;
  // for the console: preview.push({ dir: "rx", sender: "05-10-A2-B3", rorg: "F6", data: "50", status: "30", time: new Date().toISOString() })
  // ?open=devices:sub1 shows the Devices view with that device opened, ?open=telegrams:gateway the
  // first gateway's details; for screenshots
  const [view, what] = (new URLSearchParams(location.search).get("open") || "").split(":");
  if (view) {
    await new Promise((resolve) => setTimeout(resolve, 600));
    panel._setView(view);
    if (view === "installation" && what && what.startsWith("tab")) { panel._in.tab = what.slice(3); }
    if (what === "menu") panel._toggleMenu(true);
    else if (what === "gateway") panel._gatewayDetails.add("gw1");
    else if (what) {
      panel._devOpen.add(what);
      await panel._loadDevDetail(what, "gw1");
    }
    // ?iview=bus|funk|virt, ?iart=sensor ..., ?ilinks=sender|matrix pick what the Installation view shows
    const q = new URLSearchParams(location.search);
    if (q.get("iview")) panel._in.view = q.get("iview");
    if (q.get("iart")) panel._in.art = q.get("iart");
    if (q.get("ilinks")) panel._in.linkView = q.get("ilinks");
    if (view === "installation") panel._renderInstallation();
    panel._renderCards();
    panel._render();
  }
  window.preview = { panel, ...fake };
</script>
</body>
</html>
