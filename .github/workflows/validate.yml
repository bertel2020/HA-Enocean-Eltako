name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Type check (mypy strict)
        run: mypy
      - name: Protocol layer import check
        run: python scripts/check_protocol_imports.py
      - name: Cache official EEP definitions
        uses: actions/cache@v4
        with:
          path: .eep_cache
          key: eep-cache-${{ hashFiles('scripts/fetch_eep.py') }}
      - name: Fetch official EEP definitions (not committed, see NOTICE)
        run: python scripts/fetch_eep.py --generated
      - name: Generated EEP profiles up to date
        run: python scripts/generate_eep.py --check
      - name: Device docs up to date
        run: python scripts/gen_device_docs.py --check
      - name: Run tests
        run: python -m pytest -q --cov=custom_components/enocean_eltako --cov-fail-under=95

  package:
    name: Protocol package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python scripts/build_protocol_package.py
      - name: Import without Home Assistant
        run: |
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install dist/*.whl
          cd /tmp && /tmp/pkg/bin/python -I -c "import enocean_eltako_protocol.gateway, enocean_eltako_protocol.eep.std.profiles"
      - name: Keep the built package
        uses: actions/upload-artifact@v4
        with:
          name: enocean-eltako-protocol
          path: dist/

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # The HACS action can only validate public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
          # No brand assets yet; added before the first release.
          ignore: brands
