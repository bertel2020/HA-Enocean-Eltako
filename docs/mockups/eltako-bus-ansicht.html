<!doctype html>
<!-- Mockup (kein Produktionscode): neue Ansicht "Eltako-Bus" der Installationsdokumentation.
     Eigenständig, ohne externe Abhängigkeiten. Beispieldaten passend zur Panel-Vorschau
     (scripts/panel-preview/fake-hass.js). Konzept: docs/mockups/eltako-bus-konzept.md -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eltako-Bus Mockup</title>
<style>
  /* Farbwerte aus frontend/theme.js (Schema "ocean") und den Art-Farben aus installation.js */
  :root {
    --bg: #f4f6f9; --surface: #ffffff; --soft: #f5f7f9; --line: #e1e5ea; --line-2: #eef0f3; --input-line: #c3cbd5;
    --text: #1b1f24; --muted: #5b6270; --accent: #0a6aa8; --accent-hover: #07507f; --accent-soft: #eaf3fa; --on-accent: #fff;
    --neutral-soft: #eef1f4; --tag-text: #3a414c;
    --ok: #1e6b34; --ok-soft: #e6f4ea; --warn: #8a4b00; --warn-soft: #fff1de; --warn-line: #f3d19e;
    --bad: #a1261b; --bad-soft: #fdecea; --bad-line: #f2b8b5; --focus: #7db8e0; --shadow-c: rgba(16,24,40,.08);
    --k-bus: #2f6fb5; --k-sensor: #139a87; --k-taster: #7b5cc9; --k-aktor: #d77f1f; --k-virt: #c2477f; --k-psu: #6b7b8d;
    --k-cover: #139a87; --k-dim: #7b5cc9; --k-meter: #4f8a2b; --k-input: #c2477f; --k-foreign: #9aa3ad;
    --fs: 1; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --surface: #1b1f24; --soft: #22272e; --line: #2d333b; --line-2: #262c33; --input-line: #3a424c;
      --text: #e6e9ed; --muted: #9aa4b1; --accent: #5bb2ea; --accent-hover: #8ccaf2; --accent-soft: #16324a; --on-accent: #0b1a26;
      --neutral-soft: #2a3038; --tag-text: #c5ccd5;
      --ok: #7fd49a; --ok-soft: #173a24; --warn: #f2c27a; --warn-soft: #3a2a12; --warn-line: #6b4a1c;
      --bad: #f2a29a; --bad-soft: #3d1c19; --bad-line: #6e2f2a; --shadow-c: rgba(0,0,0,.4);
      --k-bus: #6aa6e8; --k-aktor: #f0a24f; --k-cover: #3cc4b0; --k-dim: #a78bf0; --k-meter: #8cc56a; --k-input: #e47aa8; --k-psu: #95a3b3; --k-foreign: #6b737c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #1b1f24; --soft: #22272e; --line: #2d333b; --line-2: #262c33; --input-line: #3a424c;
    --text: #e6e9ed; --muted: #9aa4b1; --accent: #5bb2ea; --accent-hover: #8ccaf2; --accent-soft: #16324a; --on-accent: #0b1a26;
    --neutral-soft: #2a3038; --tag-text: #c5ccd5;
    --ok: #7fd49a; --ok-soft: #173a24; --warn: #f2c27a; --warn-soft: #3a2a12; --warn-line: #6b4a1c;
    --bad: #f2a29a; --bad-soft: #3d1c19; --bad-line: #6e2f2a; --shadow-c: rgba(0,0,0,.4);
    --k-bus: #6aa6e8; --k-aktor: #f0a24f; --k-cover: #3cc4b0; --k-dim: #a78bf0; --k-meter: #8cc56a; --k-input: #e47aa8; --k-psu: #95a3b3; --k-foreign: #6b737c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: calc(14px * var(--fs))/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  .muted, .isub { color: var(--muted); }
  .isub { font-size: 12px; }
  a.lnk, button.lnk { all: unset; cursor: pointer; color: var(--accent); }
  a.lnk:hover, button.lnk:hover { text-decoration: underline; }
  button.lnk:focus-visible { outline: 2px solid var(--focus); border-radius: 3px; }

  .app { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; flex-wrap: wrap; }
  header.top h1 { font-size: 20px; font-weight: 500; margin: 0; flex: 1 1 auto; }
  .mockbadge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px dashed var(--input-line); color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .chip { min-height: 32px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--input-line); font-size: 13px; font-weight: 500; background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip:hover { background: var(--accent-soft); color: var(--accent-hover); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-hover); background: var(--accent-soft); }
  .chip.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip.small { min-height: 26px; padding: 0 10px; font-size: 12px; }
  .chip:focus-visible, .itab:focus-visible, .tile-dev:focus-visible, .addr:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--soft); color: var(--tag-text); white-space: nowrap; border: 0; }
  button.tag { cursor: pointer; }
  button.tag:hover { filter: brightness(.95); text-decoration: underline; }
  .tag.kind { background: color-mix(in srgb, var(--k) 16%, transparent); color: color-mix(in srgb, var(--k) 70%, var(--text)); font-weight: 500; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.doc { background: none; border: 1px dashed var(--input-line); color: var(--muted); }
  .tag.ent { background: var(--accent-soft); color: var(--accent); font-family: ui-monospace, monospace; }
  [data-k="master"] { --k: var(--k-bus); } [data-k="switch"] { --k: var(--k-aktor); } [data-k="cover"] { --k: var(--k-cover); }
  [data-k="dimmer"] { --k: var(--k-dim); } [data-k="meter"] { --k: var(--k-meter); } [data-k="supply"] { --k: var(--k-psu); }
  [data-k="input"] { --k: var(--k-input); } [data-k="timer"] { --k: var(--k-bus); } [data-k="foreign"] { --k: var(--k-foreign); }

  /* Bus-Auswahl und Zugang */
  .busbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .access { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
  .access .card { padding: 12px 14px; display: grid; gap: 4px; }
  .access .role { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .access b { font-weight: 500; }
  .access .master { border-left: 3px solid var(--k-bus); }
  .access .radio { border-left: 3px solid var(--input-line); }

  /* Tabs */
  nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
  .itab { font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px 11px; margin-bottom: -1px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .itab:hover { color: var(--text); }
  .itab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .itab .cnt { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); }
  .itab .cnt.warn { background: var(--warn-soft); color: var(--warn); }
  main { padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
  main > * { min-width: 0; }
  dl.kv dd.mono { white-space: normal; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar .grow { flex: 1 1 auto; }
  h2 { font-size: 16px; font-weight: 500; margin: 0; }
  h3 { font-size: 14px; font-weight: 500; margin: 0; }
  p { margin: 0; }

  /* Kennzahlen */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .tile { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--soft)); border-radius: 8px; padding: 8px 12px; font-size: 18px; font-weight: 500; line-height: 1.3; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; cursor: pointer; color: var(--text); }
  .tile small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
  .tile .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .tile.ok { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--soft)); }
  .tile.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--soft)); }
  .tile.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--soft)); }
  .tile:hover { filter: brightness(.98); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
  .panel { padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
  .panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .panel-head .grow { flex: 1; }

  /* Topologie */
  .topo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
  .topo .node { padding: 4px 10px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; }
  .topo .node:hover { border-color: var(--accent); }
  .topo .node.m { border-color: var(--k-bus); background: color-mix(in srgb, var(--k-bus) 10%, var(--surface)); }
  .topo .wire { color: var(--muted); font-size: 12px; }
  .topo .end { font-size: 12px; padding: 3px 8px; border-radius: 8px; border: 1px dashed var(--input-line); color: var(--muted); }

  /* Schrank / Hutschiene */
  .cab { padding: 12px 14px 14px; display: grid; gap: 12px; }
  .cabhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .cabhead .grow { flex: 1; }
  .rowbox { display: grid; gap: 6px; }
  .rowlabel { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .rowlabel b { font-weight: 500; }
  .railwrap { overflow-x: auto; padding-bottom: 4px; }
  .rail { --cols: 24; position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(22px, 1fr)); grid-template-rows: auto 22px; min-width: calc(var(--cols) * 22px);
          border-radius: 6px; background-color: var(--soft); background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / (var(--cols) / 2)) 100%; padding: 6px 0 0; border: 1px solid var(--line); }
  .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 14px; transform: translateY(-50%); background: linear-gradient(var(--line), var(--line-2)); opacity: .9; z-index: 0; }
  .tile-dev { position: relative; z-index: 1; grid-row: 1; margin: 0 1px; min-height: 156px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--k) 45%, var(--line)); background: color-mix(in srgb, var(--k) 12%, var(--surface));
              display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px 2px; cursor: pointer; text-align: center; overflow: hidden; color: var(--text); }
  .tile-dev:hover { border-color: var(--k); box-shadow: 0 2px 6px var(--shadow-c); }
  .tile-dev.doc { border-style: dashed; }
  .tile-dev.master { background: color-mix(in srgb, var(--k-bus) 20%, var(--surface)); border-width: 2px; }
  .tile-dev.foreign { background: repeating-linear-gradient(45deg, var(--soft) 0 6px, var(--surface) 6px 12px); border-style: dashed; cursor: default; }
  .tile-dev.hl { animation: hl 1.6s ease-out 2; }
  @keyframes hl { 0% { box-shadow: 0 0 0 0 var(--accent); } 40% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .tile-dev .adr { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; padding: 0 4px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
  .tile-dev .adr.none { color: var(--warn); border-color: var(--warn-line); }
  .tile-dev .type { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 600; letter-spacing: .02em; flex: 1; white-space: nowrap; }
  .tile-dev.wide .type { writing-mode: horizontal-tb; transform: none; flex: 0; padding-top: 6px; }
  .tile-dev .lbl { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .tile-dev .leds { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .tile-dev.wide .leds { flex-direction: row; }
  .led { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--k); background: var(--k); }
  .led.doc { background: transparent; border-style: dashed; }
  .led.free { background: transparent; border-color: var(--input-line); }
  .tile-dev .flag { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  .tile-dev .flag.bad { background: var(--bad); }
  .tile-dev .mtag { font-size: 10px; font-weight: 600; color: var(--on-accent); background: var(--k-bus); border-radius: 6px; padding: 0 5px; }
  .spacer { grid-row: 1; z-index: 1; margin: 0 1px; min-height: 156px; border-radius: 4px; border: 1px dashed var(--input-line); background: repeating-linear-gradient(90deg, transparent 0 3px, var(--line) 3px 4px); display: grid; place-items: center; }
  .spacer span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; color: var(--muted); }
  .tb { grid-row: 1; z-index: 2; justify-self: end; width: 0; border-right: 3px dashed var(--bad); margin-right: -2px; position: relative; }
  .tb span { position: absolute; bottom: 2px; left: 4px; font-size: 10px; font-weight: 600; color: var(--bad); background: var(--surface); padding: 0 3px; border-radius: 4px; white-space: nowrap; }
  .term { grid-row: 1; z-index: 2; align-self: center; justify-self: start; font-size: 10px; padding: 2px 4px; margin-left: 4px; border-radius: 4px; background: var(--surface); border: 1px solid var(--input-line); white-space: nowrap; }
  .band { grid-row: 2; align-self: center; height: 16px; margin: 0 1px; border-radius: 4px; font-size: 10px; line-height: 16px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: 0;
          background: color-mix(in srgb, var(--sec) 22%, transparent); color: color-mix(in srgb, var(--sec) 75%, var(--text)); text-align: left; }
  .band.bad { background: color-mix(in srgb, var(--bad) 25%, transparent); color: var(--bad); }
  .rowfoot { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .moves { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
  .moves button { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--input-line); background: var(--surface); cursor: pointer; font-size: 11px; line-height: 1; }
  .moves button:hover { border-color: var(--accent); color: var(--accent); }
  .tray { border: 1px dashed var(--warn-line); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 4px; }
  .minirail { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 0; height: 26px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
  .minirail div { grid-row: 1; background: color-mix(in srgb, var(--k) 45%, var(--surface)); border-right: 1px solid var(--surface); }
  .minirail div.doc { background: color-mix(in srgb, var(--k) 20%, var(--surface)); }
  .cabcard { padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
  .cabcard:hover { border-color: var(--accent); }
  .cabcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  /* Tabellen */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  tr.mod td { background: color-mix(in srgb, var(--k) 7%, var(--surface)); border-top: 1px solid var(--line); }
  tr.mod td:first-child { border-left: 3px solid var(--k); }
  tr.ch td:first-child { border-left: 3px solid color-mix(in srgb, var(--k) 35%, transparent); }
  tr.free td { color: var(--muted); background: var(--soft); font-size: 12px; padding: 3px 8px; }
  tr.dup td { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
  tr.unused td { color: var(--muted); font-style: italic; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  input.search { min-height: 32px; padding: 0 12px; border: 1px solid var(--input-line); border-radius: 18px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; width: 240px; max-width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .seg button { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 5px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  /* Adressplan */
  .addrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
  .addr { min-height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); font-size: 11px; display: grid; align-content: center; justify-items: center; padding: 2px; cursor: default; color: var(--muted); }
  .addr b { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); font-weight: 600; }
  .addr.used { cursor: pointer; background: color-mix(in srgb, var(--k) 18%, var(--surface)); border-color: color-mix(in srgb, var(--k) 45%, var(--line)); }
  .addr.used.doc { border-style: dashed; }
  .addr.dup { background: var(--bad-soft); border: 2px solid var(--bad); }
  .addr .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; color: var(--muted); }

  /* Netzteile */
  .secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .sec { padding: 12px 14px; display: grid; gap: 8px; border-left: 4px solid var(--sec); }
  .loadbar { position: relative; height: 12px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); overflow: visible; }
  .loadbar i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
  .loadbar i.warn { background: var(--warn); } .loadbar i.bad { background: var(--bad); }
  .loadbar .mark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dotted var(--muted); }
  .loadbar .mark span { position: absolute; top: 14px; left: -10px; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .sec table td, .sec table th { padding: 4px 6px; }

  /* Prüfungen */
  .checks { display: grid; gap: 8px; }
  .check { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .check .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .check.bad .ic { background: var(--bad-soft); color: var(--bad); } .check.bad { border-color: var(--bad-line); }
  .check.warn .ic { background: var(--warn-soft); color: var(--warn); } .check.warn { border-color: var(--warn-line); }
  .check.info .ic { background: var(--accent-soft); color: var(--accent); }
  .check.ok .ic { background: var(--ok-soft); color: var(--ok); }
  .check b { font-weight: 500; }
  .check .chips { margin-top: 4px; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 20; }
  aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px var(--shadow-c); z-index: 21; display: flex; flex-direction: column; }
  .dhead { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .dhead .bar { display: flex; gap: 6px; align-items: center; }
  .dhead .bar .grow { flex: 1; }

// ---------------------------------------------------------------------------------------------
// Zustand und Hilfen
// ---------------------------------------------------------------------------------------------
const VIEWS = [["overview", "Übersicht"], ["cabinet", "Schrank"], ["list", "Liste"], ["addr", "Adressen"], ["psu", "Netzteile"], ["checks", "Prüfungen"]];
const state = { view: "overview", cab: "c1", detail: null, hl: null, history: [], edit: false, listMode: "place", q: "", toast: "", formErr: "", theme: "auto" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtW = (n) => `${(Math.round(n * 100) / 100).toLocaleString("de-DE", { maximumFractionDigits: 2 })} W`;

const mod = (id) => DATA.modules.find((m) => m.id === id);

const teOf = (m) => m.te ?? typeOf(m).te;

const rowOf = (id) => { for (const c of DATA.cabinets) for (const r of c.rows) if (r.id === id) return { cab: c, row: r }; return null; };

const addrCount = (m) => (m.channels ? Math.max(typeOf(m).addrs, 0) || m.channels.length : 0);
const chAddr = (m, ch) => (m.first == null ? null : m.first + ch.n - 1);

const powerOf = (m) => (m.powerUser != null ? { w: m.powerUser, from: "user" } : typeOf(m).power != null ? { w: typeOf(m).power, from: "table" } : { w: null, from: "" });

const slotText = (m) => (teOf(m) <= 1 ? fmtNum(m.slot) : `${fmtNum(m.slot)}–${fmtNum(m.slot + teOf(m) - 1)}`);
const fmtNum = (n) => String(n).replace(".", ",");
const modTitle = (m) => (m.name && m.name !== m.type ? `${m.type} · ${m.name}` : m.type);
const isBus = (m) => kindOf(m) !== "foreign";

// Bus-Reihenfolge: Schrank, Reihe, Platz (links → rechts)
function busOrder() {
  const pos = new Map();
  let i = 0;
  for (const c of DATA.cabinets) for (const r of c.rows) pos.set(r.id, i++);
  return DATA.modules.filter((m) => m.row && isBus(m)).sort((a, b) => pos.get(a.row) - pos.get(b.row) || a.slot - b.slot);

// Speiseabschnitte: getrennt durch eine Trennbrücke TB14 und zwischen Schränken (Annahme: die Busleitung führt keine 12 V)
const SEC_COLORS = ["var(--k-bus)", "var(--k-aktor)", "var(--k-cover)", "var(--k-dim)"];
function sections() {
  const out = [];
  let cur = null, lastCab = null, lastTb = false;
  for (const m of busOrder()) {
    const cab = rowOf(m.row).cab.id;
    if (!cur || lastTb || cab !== lastCab) { cur = { id: String.fromCharCode(65 + out.length), mods: [] }; out.push(cur); }
    cur.mods.push(m);
    lastCab = cab; lastTb = !!m.tbAfter;
  }
  for (const [i, s] of out.entries()) {
    s.color = SEC_COLORS[i % SEC_COLORS.length];
    s.supplies = s.mods.filter((m) => ["master", "supply"].includes(kindOf(m)));
    s.capacity = s.supplies.length * SUPPLY_LIMIT;
    s.consumers = s.mods.filter((m) => kindOf(m) !== "supply");
    s.load = s.consumers.reduce((n, m) => n + (powerOf(m).w ?? 0), 0);
    s.missing = s.consumers.filter((m) => powerOf(m).w == null);
    s.addrs = s.mods.flatMap((m) => (m.channels ?? []).map((c) => chAddr(m, c)).filter((a) => a != null));
    s.state = !s.supplies.length || s.load > s.capacity ? "bad" : s.load > s.capacity * RESERVE ? "warn" : "ok";
    s.name = s.supplies.map((x) => (kindOf(x) === "master" ? "Netzteil im FAM14" : x.name)).join(" + ") || "ohne Netzteil";
  }
  return out;
}
const sectionOf = (m) => sections().find((s) => s.mods.includes(m));
// alle Kanäle mit Adresse
function channels() {
  return DATA.modules.flatMap((m) => (m.channels ?? []).filter((c) => !c.unused || m.first != null).map((c) => ({ m, c, a: chAddr(m, c) })));
}
function addrMap() {
  const map = new Map();
  for (const x of channels()) if (x.a != null) map.set(x.a, [...(map.get(x.a) ?? []), x]);
  return map;
}
function overlaps(m, row, slot, te, spacer) {
  const a0 = slot - (spacer ? 0.5 : 0), a1 = slot + te;
  return DATA.modules.filter((o) => o !== m && o.row === row).find((o) => { const b0 = o.slot - (o.spacer ? 0.5 : 0), b1 = o.slot + teOf(o); return a0 < b1 && b0 < a1; });
}

// Prüfungen
function checks() {
  const out = [];
  const T = (type, id, label) => ({ type, id, label });
  const map = addrMap();
  for (const [a, list] of [...map].sort((x, y) => x[0] - y[0])) if (list.length > 1)
    out.push({ lvl: "bad", key: "dup", title: `Bus-Adresse ${a} doppelt vergeben`, text: `${list.map((x) => x.c.name || `Kanal ${x.c.n}`).join(" und ")} melden sich unter derselben Adresse. Der FAM14 vergibt jede Adresse nur einmal; eine Angabe ist falsch oder ein Gerät wurde neu adressiert.`, targets: list.map((x) => T("channel", `${x.m.id}:${x.c.n}`, `${x.m.type} · ${x.c.name}`)) });
  for (const s of sections()) {
    if (!s.supplies.length) out.push({ lvl: "bad", key: "nosupply", title: `Abschnitt ${s.id} ohne Netzteil`, text: "Zwischen zwei Trennbrücken bzw. in diesem Schrank sitzt kein FAM14 oder FSNT14.", targets: [T("section", s.id, `Abschnitt ${s.id}`)] });

    else if (s.state === "warn") out.push({ lvl: "warn", key: "reserve", title: `${s.name}: wenig Reserve (${fmtW(s.load)} von ${fmtW(s.capacity)})`, text: "Über 2/3 der Nennleistung empfiehlt sich ein weiteres Netzteil.", targets: [T("section", s.id, `Abschnitt ${s.id}`)] });
  }
  const noAddr = DATA.modules.filter((m) => addrCount(m) && m.first == null);
  for (const m of noAddr) out.push({ lvl: "warn", key: "noaddr", title: `${m.type} „${m.name}“ hat noch keine Bus-Adresse`, text: "Ohne Adresse zählt es nicht in der Adressbelegung; PCT14 kann es nicht auslesen.", targets: [T("module", m.id, modTitle(m))] });
  for (const m of DATA.modules.filter((x) => !x.row)) out.push({ lvl: "warn", key: "noplace", title: `${m.type} „${m.name}“ ohne Einbauort`, text: "Schrank, Reihe und Platz fehlen; das Gerät zählt in keinem Speiseabschnitt mit.", targets: [T("module", m.id, modTitle(m))] });
  for (const m of DATA.modules.filter((x) => x.type === "FUD14" && x.row && !x.spacer)) out.push({ lvl: "warn", key: "spacer", title: `FUD14 „${m.name}“ ohne ½ TE Abstand`, text: "Die Planungshilfe empfiehlt beim FUD14 die langen Brücken (½ TE Luft für die Wärme).", targets: [T("module", m.id, modTitle(m))] });
  for (const c of DATA.cabinets) for (const r of c.rows) {
    const used = DATA.modules.filter((m) => m.row === r.id).reduce((n, m) => Math.max(n, m.slot + teOf(m) - 1), 0);
    if (used > r.te) out.push({ lvl: "bad", key: "overflow", title: `${c.name} · ${r.name}: Reihe zu voll`, text: `Belegt bis ${fmtTE(used)}, die Reihe hat ${fmtTE(r.te)}.`, targets: [T("row", r.id, `${c.name} · ${r.name}`)] });
  }

  if (terms.length !== 1) out.push({ lvl: "warn", key: "term", title: terms.length ? "Mehr als ein Abschlusswiderstand am Bus-Ende" : "Abschlusswiderstand nicht dokumentiert", text: "Am letzten Gerät des letzten Strangs gehört genau ein Abschlusswiderstand 120 Ω.", targets: terms.map((m) => T("module", m.id, modTitle(m))) });

  if (missing.length) out.push({ lvl: "info", key: "nopower", title: `${missing.length} Gerät ohne Leistungswert`, text: "Die Planungshilfe (07/2014) nennt keinen Wert; trage ihn aus dem Datenblatt ein.", targets: missing.map((m) => T("module", m.id, modTitle(m))) });
  const used = [...map.keys()].sort((a, b) => a - b);
  const gaps = []; let prev = 0;
  for (const a of used) { if (a > prev + 1) gaps.push(a - 1 === prev + 1 ? `${prev + 1}` : `${prev + 1}–${a - 1}`); prev = a; }
  if (gaps.length) out.push({ lvl: "info", key: "gaps", title: `Lücken in der Adressbelegung: ${gaps.join(", ")}`, text: "Kein Fehler: frei gewordene oder reservierte Adressen. Höchste belegte Adresse: " + prev + ".", targets: [T("view", "addr", "Adressplan")] });
  const notHa = channels().filter((x) => !x.c.unused && !x.c.entity);
  if (notHa.length) out.push({ lvl: "info", key: "notha", title: `${notHa.length} Kanäle nur dokumentiert (nicht in Home Assistant)`, text: "Am Bus vorhanden, aber ohne HA-Gerät. Mit „Als Gerät hinzufügen“ einrichten oder bewusst so lassen.", targets: notHa.map((x) => T("channel", `${x.m.id}:${x.c.n}`, x.c.name)) });
  for (const m of DATA.modules.filter((x) => x.legacy)) {
    const s = sectionOf(m);
    const real = s ? s.addrs.sort((a, b) => a - b) : [];
    out.push({ lvl: "info", key: "legacy", title: `${m.name}: bisheriger Adressbereich ${m.legacy} übernommen`, text: `Bisher wurde das Netzteil über einen Adressbereich zugeordnet. Nach Einbaulage speist es ${real.length ? `die Adressen ${real[0]}–${real[real.length - 1]} (Abschnitt ${s.id})` : "keine Geräte"}. Bereich bestätigen oder verwerfen.`, targets: [T("module", m.id, modTitle(m))] });
  }
  return out;
}

function snapshot() { return { view: state.view, cab: state.cab, detail: state.detail, hl: state.hl }; }
function go(patch) { state.history.push(snapshot()); Object.assign(state, { formErr: "" }, patch); render(); }
function back() { const s = state.history.pop(); if (s) Object.assign(state, s, { formErr: "" }); render(); }
function openTarget(type, id) {
  if (type === "module" || type === "channel" || type === "sender" || type === "section" || type === "gateway") return go({ detail: { type, id } });
  if (type === "row") { const r = rowOf(id); return go({ view: "cabinet", cab: r.cab.id, detail: null, hl: id }); }
  if (type === "cabinet") return go({ view: "cabinet", cab: id, detail: null, hl: null });
  if (type === "view") return go({ view: id, detail: null });
  if (type === "place") { const m = mod(id); return go({ view: "cabinet", cab: rowOf(m.row).cab.id, detail: null, hl: id }); }
}
function toast(text) { state.toast = text; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { state.toast = ""; render(); }, 2600); }

      ${flag ? `<span class="flag ${flag}"></span>` : ""}${adr}<span class="type">${esc(m.type)}</span>${te >= 2 ? `<span class="lbl">${esc(k === "master" ? "Netzteil 12 W integriert" : m.name || "")}</span>` : ""}<span class="leds">${leds}</span>${moves}</button>`);

      <td>${L("module", m.id, `<b>${esc(m.type)}</b>`)} ${m.name && m.name !== m.type ? esc(m.name) : ""} ${m.src === "doc" ? '<span class="tag doc">dokumentiert</span>' : ""}<div class="isub">${fmtTE(teOf(m))}${kindOf(m) === "master" ? " · Bus-Master" : ""}</div></td>
      <td class="mono">${range(m) ?? (addrCount(m) ? '<span class="tag warn">ohne</span>' : "–")}</td>
      <td class="hide-s isub">${esc(typeOf(m).label)}</td><td></td><td class="hide-s"></td><td></td>
      <td class="num">${kindOf(m) === "supply" ? "<span class='isub'>liefert 12 W</span>" : p.w != null ? `${fmtW(p.w)}${p.from === "user" ? ' <span class="tag">eingetragen</span>' : ""}` : '<span class="tag warn">kein Wert</span>'}</td>
      <td class="hide-s">${s ? L("section", s.id, `${s.id} · ${esc(s.name)}`) : '<span class="isub">–</span>'}</td></tr>`;
  };
  let body = "";
  if (state.listMode === "place") {
    const order = [...busOrder(), ...DATA.modules.filter((m) => !m.row)];
    for (const m of order) {
      const chs = (m.channels ?? []).filter((c) => match(m, c));
      if (!match(m) && !chs.length) continue;
      body += modRow(m) + chs.map((c) => chRow(m, c)).join("");
    }
  } else {
    const list = channels().filter((x) => x.a != null && match(x.m, x.c)).sort((a, b) => a.a - b.a);
    let prev = 0;
    for (const x of list) {
      if (!q && x.a > prev + 1) body += `<tr class="free"><td colspan="9">frei: ${x.a - 1 === prev + 1 ? prev + 1 : `${prev + 1}–${x.a - 1}`}</td></tr>`;
      body += chRow(x.m, x.c).replace(`<td class="isub">Kanal ${x.c.n}</td>`, `<td>${L("module", x.m.id, esc(x.m.type))}<div class="isub">K${x.c.n} · ${esc(x.m.row ? rowOf(x.m.row).cab.name : "ohne Ort")}</div></td>`);
      prev = Math.max(prev, x.a);
    }
    if (!q) body += `<tr class="free"><td colspan="9">frei: ${prev + 1}–126</td></tr>`;
    const noA = channels().filter((x) => x.a == null && match(x.m, x.c));
    if (noA.length) body += `<tr class="free"><td colspan="9"><b>Ohne Bus-Adresse</b></td></tr>` + noA.map((x) => chRow(x.m, x.c)).join("");
  }
  return `<div class="toolbar"><div class="seg" role="group"><button data-list="place" aria-pressed="${state.listMode === "place"}">Nach Einbauort</button><button data-list="addr" aria-pressed="${state.listMode === "addr"}">Nach Adresse</button></div>
    <input class="search" type="search" placeholder="Suchen: Name, Typ, Entität, ID …" value="${esc(state.q)}" data-search aria-label="Suchen">
    <span class="grow"></span><button class="chip" data-act="csv">Als CSV</button><button class="chip" data-act="adddoc">+ Bus-Gerät dokumentieren</button></div>
    <div class="card"><div class="tablewrap"><table><thead>${head}</thead><tbody>${body || '<tr><td colspan="9" class="muted">Nichts gefunden.</td></tr>'}</tbody></table></div></div>
    <p class="note">Ein Reiheneinbaugerät ist eine Zeile, seine Kanäle stehen darunter. Jeder Kanal ist in Home Assistant ein eigenes Gerät (eigene Funk-ID); die Bus-Adressen eines Mehrkanalgeräts sind fortlaufend.</p>`;
}

function viewAddr() {
  const map = addrMap();
  const cells = [];
  for (let a = 1; a <= 126; a++) {
    const l = map.get(a);
    if (!l) { cells.push(`<div class="addr"><b>${a}</b><span class="t">frei</span></div>`); continue; }
    const x = l[0];
    cells.push(`<button class="addr used${l.length > 1 ? " dup" : ""}${x.c.entity ? "" : " doc"}" data-k="${kindOf(x.m)}" data-go="channel|${x.m.id}:${x.c.n}" title="${esc(l.map((y) => `${y.m.type} K${y.c.n}: ${y.c.name}`).join(" / "))}"><b>${a}</b><span class="t">${l.length > 1 ? "2×!" : esc(x.m.type.replace("-", ""))}</span></button>`);
  }
  return `<div class="toolbar"><h2>Adressplan 1–126</h2><span class="isub">${map.size} belegt · ${126 - map.size} frei · eine Adresse je Kanal</span></div>
    <div class="card panel"><div class="addrgrid">${cells.join("")}</div><div class="legend">${legend()}<span><i class="led" style="--k:var(--bad);background:var(--bad-soft)"></i>doppelt</span></div></div>
    <p class="note">Der FAM14 vergibt beim Einlernen (Drehschalter BA auf 1, Aktor auf LRN) automatisch fortlaufende Adressen je Kanal. Hier wird festgehalten, was vergeben ist; später kann die Integration es aus dem FAM14 lesen.</p>`;
}

function viewPsu() {
  const secs = sections();

    <div class="secs">${cards}</div>
    ${unplaced.length ? `<div class="tray"><b>Keinem Abschnitt zugeordnet (ohne Einbauort):</b> ${unplaced.map((m) => `<button class="chip small" data-go="module|${m.id}">${esc(modTitle(m))} · ${powerOf(m).w != null ? fmtW(powerOf(m).w) : "kein Wert"}</button>`).join("")}</div>` : ""}`;

function secCard(s, compact = false) {

  const rows = s.consumers.map((m) => { const p = powerOf(m); return `<tr><td>${L("module", m.id, esc(m.type))} <span class="isub">${esc(m.name && m.name !== m.type ? m.name : "")}</span></td><td class="mono">${range(m) ?? (kindOf(m) === "master" ? "Master" : "–")}</td><td class="num">${p.w != null ? fmtW(p.w) : '<span class="tag warn">kein Wert</span>'}${p.from === "user" ? ' <span class="tag" title="' + esc(m.powerNote ?? "") + '">eingetragen</span>' : ""}</td></tr>`; }).join("");

    <div class="panel-head"><h3>Abschnitt ${s.id}</h3><span class="tag ${s.state}">${s.state === "bad" ? (s.supplies.length ? "überlastet" : "kein Netzteil") : s.state === "warn" ? "wenig Reserve" : "in Ordnung"}</span><span class="grow"></span><span class="isub">${cabs.map(esc).join(", ")}</span></div>

    <div><div class="loadbar" title="${fmtW(s.load)} von ${fmtW(s.capacity)}"><i class="${s.state === "ok" ? "" : s.state}" style="width:${pct}%"></i>${s.capacity ? `<span class="mark" style="left:${RESERVE * 100}%"><span>8 W</span></span>` : ""}</div>
      <div class="panel-head" style="margin-top:14px"><b>${fmtW(s.load)}</b><span class="isub">von ${fmtW(s.capacity)} · ${s.capacity ? Math.round((s.load / s.capacity) * 100) : "–"} %${s.missing.length ? ` · ${s.missing.length} ohne Wert` : ""} · Adressen ${s.addrs.length ? `${Math.min(...s.addrs)}–${Math.max(...s.addrs)}` : "–"}</span></div></div>
    ${compact ? "" : `<div class="tablewrap"><table><thead><tr><th>Verbraucher</th><th>Adr.</th><th class="num">Leistung</th></tr></thead><tbody>${rows}</tbody></table></div>`}
  </div>`;
}

function checkHtml(c) {
  const icon = { bad: "!", warn: "!", info: "i", ok: "✓" }[c.lvl];
  return `<div class="check ${c.lvl}"><span class="ic">${icon}</span><div><b>${esc(c.title)}</b><div class="isub">${esc(c.text)}</div>${c.targets?.length ? `<div class="chips">${c.targets.map((t) => `<button class="chip small" data-go="${t.type}|${esc(t.id)}">${esc(t.label)}</button>`).join("")}</div>` : ""}</div></div>`;
}
function viewChecks(cks) {
  const grp = (lvl, title) => { const l = cks.filter((c) => c.lvl === lvl); return l.length ? `<h3>${title} (${l.length})</h3><div class="checks">${l.map(checkHtml).join("")}</div>` : ""; };

        <dt>HA-Entität</dt><dd>${c.entity ? `<button class="tag ent" data-act="entity" data-ent="${esc(c.entity)}">${esc(c.entity)}</button> <span class="isub">Bereich ${esc(c.area)}</span>` : '<span class="tag doc">nicht in Home Assistant</span>'}</dd>
        ${c.rid ? `<dt>Funk-ID (HA-Gerät)</dt><dd class="mono">${esc(c.rid)} <span class="isub">gehört zu ${L("gateway", "gw1", "FAM-USB Keller")}</span></dd>` : ""}

  const v = (f) => box.querySelector(`[data-f="${f}"]`)?.value ?? "";
  const row = v("row") || null, slot = Number(v("slot")), te = Number(v("te")), spacer = v("spacer") === "1", tb = v("tb") === "1";
  const first = v("first") === "" ? null : Number(v("first"));
  if (row) {
    const r = rowOf(row).row;
    if (!(slot >= 1 && Number.isInteger(slot * 2))) return fail("Platz: eine Zahl ab 1, in Schritten von ½ TE.");
    if (!(te >= 0.5 && Number.isInteger(te * 2))) return fail("Breite: mindestens ½ TE, in Schritten von ½ TE.");
    if (slot + te - 1 > r.te || slot - (spacer ? 0.5 : 0) < 1) return fail(`Passt nicht in die Reihe (${fmtTE(r.te)}): belegt bis ${fmtTE(slot + te - 1)}.`);
    const o = overlaps(m, row, slot, te, spacer);
    if (o) return fail(`Überschneidet sich mit ${modTitle(o)} (Platz ${slotText(o)}).`);
  }
  if (first != null && !(Number.isInteger(first) && first >= 1 && first + addrCount(m) - 1 <= 126)) return fail(`Erste Adresse: 1 bis ${127 - addrCount(m)} (${addrCount(m)} Kanäle).`);
  Object.assign(m, { row, slot: row ? slot : null, spacer, tbAfter: tb, first: addrCount(m) ? first : m.first });
  if (te !== typeOf(m).te) m.te = te; else delete m.te;
  state.formErr = "";
  toast(`Gespeichert: ${modTitle(m)} · ${place(m)}`);
}
function fail(text) { state.formErr = text; render(); }
function move(id, dir) {
  const m = mod(id);
  const mods = DATA.modules.filter((x) => x.row === m.row).sort((a, b) => a.slot - b.slot);
  const i = mods.indexOf(m), n = mods[i + dir];
  const r = rowOf(m.row).row;
  if (n) {
    const left = dir < 0 ? n : m, right = dir < 0 ? m : n;
    const start = left.slot;
    right.slot = start + (right.spacer ? 0.5 : 0) - (left.spacer ? 0.5 : 0);
    left.slot = right.slot + teOf(right) + (left.spacer ? 0.5 : 0);
    if (left.slot + teOf(left) - 1 > r.te) { toast("Kein Platz in der Reihe."); return; }
  } else {
    const ns = m.slot + dir * 0.5;
    if (ns - (m.spacer ? 0.5 : 0) < 1 || ns + teOf(m) - 1 > r.te) { toast("Am Rand der Reihe."); return; }
    m.slot = ns;
  }
  state.hl = id; render(); state.hl = null;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-act]");
  if (!t) return;
  if (t.dataset.go) { const [type, ...rest] = t.dataset.go.split("|"); openTarget(type, rest.join("|")); return; }
  if (t.dataset.view) { go({ view: t.dataset.view, detail: null, hl: null }); return; }
  if (t.dataset.cab) { go({ cab: t.dataset.cab, hl: null }); return; }
  if (t.dataset.list) { state.listMode = t.dataset.list; render(); return; }
  if (t.dataset.move) { const [id, d] = t.dataset.move.split("|"); move(id, Number(d)); return; }
  if (t.dataset.themeSet) { state.theme = t.dataset.themeSet; if (state.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", state.theme); render(); return; }
  const a = t.dataset.act;
  if (a === "close") { state.detail = null; state.formErr = ""; render(); }
  else if (a === "back") back();
  else if (a === "edit") { state.edit = !state.edit; render(); }
  else if (a === "save") saveModule(t.dataset.id);
  else if (a === "print") window.print();
  else if (a === "entity") toast(`Öffnet in Home Assistant den Dialog von ${t.dataset.ent}`);
  else if (a === "sendertab") toast("Springt in den Tab „Sender-IDs“ zu dieser Nummer");
  else if (a === "newbus") toast("Weiterer Bus: eigener FAM14 (oder FTS14KS) als Master, eigene Adressen 1–126");
  else if (a === "newcab") toast("Neuer Schrank: Name, Bereich, Reihen und TE je Reihe");
  else if (a === "newrow") toast("Neue Reihe: Name und Breite in TE");
  else if (a === "csv") toast("CSV: eine Zeile je Kanal mit Ort, Adresse, Rückmelde-ID, Entität, Leistung");
  else if (a === "adddoc" || a === "addpsu") toast("Formular: Typ wählen (Breite, Kanäle, Leistung kommen aus dem Katalog), dann Einbauort");
  else if (a === "adddev") toast("Startet „Gerät hinzufügen“ mit Typ und Rückmelde-ID vorbelegt");
  else if (a === "addsender") toast("Formular: Taster-ID, Name, Wippe/Taste – wird als dokumentierte Verknüpfung gespeichert");
  else if (a === "teach") toast("Einlernen über den Send-Queue (Prio 1) – wie im Geräte-Tab");
});
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-search]")) { state.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector("[data-search]"); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.detail) { state.detail = null; render(); } });
render();
</script>
</body>
