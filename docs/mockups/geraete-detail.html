<!doctype html>
<!-- Mockup (kein Produktionscode): Design-Durchgang für die aufgeklappte Gerätezeile der Geräte-Ansicht.
     Eigenständig, ohne externe Abhängigkeiten. Farbwerte aus frontend/theme.js (Schema "ocean").
     Umschaltbar: Vorher (heutiger Aufbau, nachgestellt) / Nachher (Vorschlag), Hell/Dunkel, Desktop/375 px. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geräte-Detail Mockup</title>
<style>
  :root {
    --bg: #f4f6f9; --surface: #ffffff; --soft: #f5f7f9; --line: #e1e5ea; --line-2: #eef0f3; --input-line: #c3cbd5;
    --text: #1b1f24; --muted: #5b6270; --accent: #0a6aa8; --accent-hover: #07507f; --accent-soft: #eaf3fa; --on-accent: #fff;
    --neutral-soft: #eef1f4; --tag-text: #3a414c; --ok: #1e6b34; --ok-soft: #e6f4ea; --warn: #8a4b00; --warn-soft: #fff1de;
    --bad: #a1261b; --bad-soft: #fdecea; --focus: #7db8e0; --shadow-c: rgba(16,24,40,.06); --fs: 1; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --surface: #1b1f24; --soft: #22272e; --line: #2d333b; --line-2: #262c33; --input-line: #3a424c;
      --text: #e6e9ed; --muted: #9aa4b1; --accent: #5bb2ea; --accent-hover: #8ccaf2; --accent-soft: #16324a; --on-accent: #0b1a26;
      --neutral-soft: #2a3038; --tag-text: #c5ccd5; --ok: #7fd49a; --ok-soft: #173a24; --warn: #f2c27a; --warn-soft: #3a2a12;
      --bad: #f2a29a; --bad-soft: #3d1c19; --shadow-c: rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #1b1f24; --soft: #22272e; --line: #2d333b; --line-2: #262c33; --input-line: #3a424c;
    --text: #e6e9ed; --muted: #9aa4b1; --accent: #5bb2ea; --accent-hover: #8ccaf2; --accent-soft: #16324a; --on-accent: #0b1a26;
    --neutral-soft: #2a3038; --tag-text: #c5ccd5; --ok: #7fd49a; --ok-soft: #173a24; --warn: #f2c27a; --warn-soft: #3a2a12;
    --bad: #f2a29a; --bad-soft: #3d1c19; --shadow-c: rgba(0,0,0,.4); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: calc(14px * var(--fs))/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 16px; position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar h1 { font-size: 16px; font-weight: 500; margin: 0 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .seg button { background: none; border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px dashed var(--input-line); color: var(--muted); }
  .stage { padding: 16px; display: flex; justify-content: center; }
  .frame { width: 100%; max-width: 1180px; transition: max-width .2s; }
  .frame.phone { max-width: 375px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--neutral-soft); color: var(--tag-text); white-space: nowrap; }
  .tag.mono { font-family: ui-monospace, monospace; font-size: 11px; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip { min-height: 32px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--input-line); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .chip.text { border-color: transparent; color: var(--accent); }
  .tile-kind { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--warn) 22%, transparent); }
  .tile-kind svg { width: 20px; height: 20px; }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .bars i { width: 3px; background: var(--ok); border-radius: 1px; }
  .bars i.off { background: var(--line); }
  .spark { width: 72px; height: 22px; color: var(--ok); }
  select.mini { height: 32px; width: 100%; border: 1px solid var(--input-line); border-radius: 8px; background: var(--surface); padding: 0 8px; }
  .note { margin-top: 12px; font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; max-width: 100ch; }

  /* ---------------- VORHER: der heutige Aufbau, nachgestellt ---------------- */
  .old .head, .old .row { display: grid; grid-template-columns: 28px minmax(160px, 1.4fr) 96px 72px 64px minmax(0, 1.2fr) minmax(250px, 1.2fr) 128px; gap: 4px 16px; align-items: center; padding: 12px 16px; }
  .old .head { padding: 8px 16px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--soft); border-bottom: 1px solid var(--line); }
  .old .row { background: color-mix(in srgb, var(--soft) 60%, transparent); }
  .old .ident { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .old .name { font-weight: 500; }
  .old .stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: var(--muted); }
  .old .stats > span:first-child { font-size: 14px; color: var(--text); }
  .old .detail { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; padding: 4px 4px 8px; }
  .old h4 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .old .dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0; }
  .old .dgrid > div { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; align-self: start; }
  .old dt { font-size: 12px; font-weight: 500; color: var(--muted); }
  .old dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .old .strip { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 4px 0; }
  .old table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .old td { padding: 8px 12px 8px 0; border-top: 1px solid var(--line-2); }
  .old tr:first-child td { border-top: 0; }

  /* ---------------- NACHHER: Vorschlag ---------------- */
  .new .head, .new .row { display: grid; grid-template-columns: 28px minmax(220px, 2fr) 120px minmax(90px, .7fr) 56px minmax(120px, 1fr) minmax(150px, auto) 72px; gap: 4px 16px; align-items: center; padding: 12px 16px; }
  /* mittlere Breite: Bereich und Entitäten wandern unter den Namen */
  @media (max-width: 1000px) {
    .new .head, .new .row { grid-template-columns: 28px minmax(200px, 2fr) 120px minmax(110px, 1fr) minmax(150px, auto) 72px; }
    .new .head > .h-area, .new .head > .h-ent, .new .row > .c-area, .new .row > .c-ent { display: none; }
    .new .msub { display: block; }
  }
  .new .head { padding: 8px 16px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--soft); border-bottom: 1px solid var(--line); }
  .new .head .r, .new .row .r { text-align: right; justify-self: end; }
  .new .row { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
  .new .ident { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .new .idtext { min-width: 0; }
  .new .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .new .idtext .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .new .heard { display: grid; justify-items: end; gap: 2px; }
  .new .heard .l1 { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; font-size: 13px; }
  .new .heard .l2 { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .new .acts { display: flex; justify-content: flex-end; gap: 2px; }
  .new .ibtn { width: 32px; height: 32px; border-radius: 16px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
  .new .ibtn svg { width: 18px; height: 18px; }
  .new .detail { grid-column: 1 / -1; display: grid; gap: 18px; padding: 8px 0 4px; }
  .new section > h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text); display: flex; gap: 8px; align-items: baseline; }
  .new section > h4::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); align-self: center; }
  .new section > h4 .sub { font-weight: 400; }
  /* ein Kartenraster für alle Abschnitte: gleiche Höhe je Zeile, breite Inhalte über 2 Spalten */
  .new .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 0; }
  .new .cards > div { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px; min-width: 0; display: grid; grid-template-rows: auto 1fr; gap: 4px; }
  .new .cards > div.wide { grid-column: span 2; }
  .new dt { font-size: 12px; font-weight: 500; color: var(--muted); }
  .new dd { margin: 0; overflow-wrap: anywhere; align-self: center; }
  .new .raw { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 2px; }
  /* eine Zeilenkomponente für Werte, Sender, Einstellungen, Entitäten: Innenabstand, feste Spalten */
  .new .rows { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
  .new .rows .li { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(140px, 1fr) minmax(100px, auto); gap: 4px 16px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line-2); }
  .new .rows .li:first-child { border-top: 0; }
  .new .rows .li > :last-child { justify-self: end; text-align: right; }
  .new .rows .li .k { color: var(--muted); }
  .new .rows .li b { font-weight: 500; }
  .new .rows .li.value b { font-size: 15px; }
  .new .rows .foot { padding: 8px 14px; border-top: 1px solid var(--line-2); background: var(--soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .new .acts-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .new input.notefield { width: 100%; font: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: inherit; }
  /* schmal: Kopf als Karte, Zeilen untereinander */
  .phone .new .head { display: none; }
  .phone .new .row { grid-template-columns: minmax(0, 1fr) auto; }
  .phone .new .row > .c-sel, .phone .new .row > .c-type, .phone .new .row > .c-area, .phone .new .row > .c-ent, .phone .new .row > .values { display: none; }
  .phone .new .ident { grid-column: 1; } .phone .new .acts { grid-column: 2; grid-row: 1; }
  .phone .new .heard { grid-column: 1 / -1; justify-items: start; grid-template-columns: auto auto; gap: 2px 10px; }
  .phone .new .cards { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .phone .new .cards > div.wide { grid-column: 1 / -1; }
  .phone .new .rows .li { grid-template-columns: minmax(0, 1fr) auto; }
  .phone .new .rows .li > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .phone .new .msub { display: block !important; }
  .phone .old .head { display: none; }
  .phone .old .row { grid-template-columns: 1fr; }
  @media (max-width: 700px) {
    .new .head { display: none; }
    .new .row { grid-template-columns: minmax(0, 1fr) auto; }
    .new .row > .c-sel, .new .row > .c-type, .new .row > .c-area, .new .row > .c-ent, .new .row > .values { display: none; }
    .new .ident { grid-column: 1; } .new .acts { grid-column: 2; grid-row: 1; }
    .new .heard { grid-column: 1 / -1; justify-items: start; }
    /* schmal: kurze Karten zu zweit, breite über die ganze Zeile */
    .new .cards { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .new .cards > div.wide { grid-column: 1 / -1; }
    .new .rows .li { grid-template-columns: minmax(0, 1fr) auto; }
    .new .rows .li > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  }
  .msub { display: none; }
  .callout { position: relative; }
  .num { position: absolute; top: -8px; right: -8px; z-index: 2; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .hide-nums .num { display: none; }
</style>
</head>
<body>
<div class="bar">
  <h1>Geräte · Detailzeile</h1><span class="badge">Mockup · Beispieldaten</span>
  <div class="seg" role="group" aria-label="Fassung"><button data-v="old">Vorher</button><button data-v="new" aria-pressed="true">Nachher</button></div>
  <div class="seg" role="group" aria-label="Farbschema"><button data-t="auto" aria-pressed="true">Auto</button><button data-t="light">Hell</button><button data-t="dark">Dunkel</button></div>
  <div class="seg" role="group" aria-label="Breite"><button data-w="desk" aria-pressed="true">Desktop</button><button data-w="phone">375 px</button></div>
  <div class="seg" role="group" aria-label="Befunde"><button data-n="on" aria-pressed="true">Befunde 1–6</button><button data-n="off">aus</button></div>
</div>
<div class="stage"><div class="frame" id="frame"><div id="app"></div></div></div>
<script>
"use strict";
// Beispiel: Zwischenstecker PSC234 (Permundo, VLD D2-01 mit Leistung), eingerichtet als M5-38-08:eltako,
// gehört über PioTek MGW-ETH; letzte Telegramme: VLD-Status (Ein) und 4BS 00 00 06 0C (A5-12-01: DB0 0x0C = Augenblicksleistung in W -> 6 W)
const D = {
  name: "Zwischenstecker Kaffeemaschine", id: "01-90-8C-14", model: "PSC234", models: ["PSC234", "PSC132", "FSR61NP-230V"], eep: "M5-38-08:eltako",
  area: "Küche", entities: 4, gateway: "PioTek MGW-ETH Wohnzimmer", heard: "vor 12 s", dbm: -61, min: -74, max: -55, count: 1284, perMin: 3, repeat: 0,
  interval: "", telegrams: "1.284",
  last: [
    { sender: "01-90-8C-14", ago: "vor 12 s", rorg: "VLD", dbm: -61, bytes: "04 60 E4", status: "00", text: [["Zustand", "Ein"], ["Ausgang", "0"]] },
    { sender: "01-90-8C-14", ago: "vor 3 min", rorg: "4BS", dbm: -63, bytes: "00 00 06 0C", status: "00", text: [["Leistung", "6 W"]] },
  ],
  values: [["Zustand", "Ein", "VLD D2-01 · Ausgang 0"], ["Leistung", "6 W", "4BS A5-12-01 · Augenblicksleistung"], ["Energie", "1,42 kWh", "4BS A5-12-01 · Zählerstand"]],
  senders: [["Zentralbefehl", "FF-B7-44-B2", "Einlerntelegramm", "beantwortet"], ["Richtungstaster", "FF-B7-44-B3", "Einlerntelegramm", ""]],
  settings: [["Plattform", "Schalter"], ["Statusabfrage beim Start", "Ja"], ["Invertiert", "Nein"]],
  ents: [["Kaffeemaschine", "switch.zwischenstecker_kaffeemaschine", "an"], ["Leistung", "sensor.zwischenstecker_kaffeemaschine_leistung", "6 W"], ["Energie", "sensor.zwischenstecker_kaffeemaschine_energie", "1,42 kWh"], ["Signalstärke", "sensor.zwischenstecker_kaffeemaschine_signal", "-61 dBm"]],
};
const state = { v: "new", w: "desk", n: true };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plug = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>`;
const more = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;
const chev = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>`;
const bars = (dbm) => { const n = dbm > -65 ? 4 : dbm > -75 ? 3 : dbm > -85 ? 2 : 1; return `<span class="bars" aria-label="${dbm} dBm">${[5, 8, 11, 14].map((h, i) => `<i class="${i < n ? "" : "off"}" style="height:${h}px"></i>`).join("")}</span>`; };
const spark = `<svg class="spark" viewBox="0 0 72 22" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="0,12 8,10 16,11 24,8 32,9 40,7 48,8 56,6 64,7 72,6"/></svg>`;
const N = (n) => `<span class="num" title="Befund ${n}">${n}</span>`;

function oldView() {
  const l = D.last[0];
  const item = (k, v, n = "") => `<div class="callout">${n}<dt>${k}</dt><dd>${v}</dd></div>`;
  return `<div class="card old">
    <div class="head"><span></span><span>Gerät</span><span>Typ</span><span>Bereich</span><span>Ent.</span><span>Werte</span><span style="text-align:right">Zuletzt gehört</span><span></span></div>
    <div class="row">
      <input type="checkbox" aria-label="auswählen">
      <div class="ident callout">${state.n ? N(5) : ""}<span class="tile-kind">${plug}</span><div><div class="name">${esc(D.name)}</div><div class="sub"><span class="mono">${D.id}</span> · ${D.model}</div></div></div>
      <div><span class="tag mono">${D.eep}</span></div><div>${D.area}</div><div style="text-align:right">${D.entities}</div>
      <div><span class="pill">aktiv</span> <span class="mono">0000060C</span></div>
      <div class="stats"><span>${D.heard}</span><span>${D.count} Telegramme · ${D.perMin}/min</span><span>${spark}${bars(D.dbm)} ${D.dbm} dBm</span></div>
      <div style="text-align:right">⋮ ⌃</div>
      <div class="detail">
        <section><h4>Identität</h4><dl class="dgrid callout">${state.n ? N(3) : ""}
          ${item("Modell", `<select class="mini"><option>${D.model}</option></select><div class="sub">Typ wählen</div>`)}${item("EEP", `<span class="mono">${D.eep}</span>`)}${item("Bereich", D.area)}${item("Gateway", D.gateway)}${item("ID", `<span class="mono">${D.id}</span>`)}</dl></section>
        <section><h4>Funk</h4><dl class="dgrid">
          ${item("Zuletzt gehört", D.heard)}${item("Signal", `${D.dbm} dBm <span class="sub">${D.min} bis ${D.max}</span>`)}${item("Repeater-Stufen", D.repeat)}${item("Telegramme seit Start", D.telegrams)}
          ${item("Letztes Telegramm", `${l.ago} · ${l.rorg} · ${l.dbm} dBm<div class="mono sub">${l.bytes} · Status ${l.status}</div><div class="sub">Zustand <b>Ein</b></div>`, state.n ? N(1) : "")}</dl></section>
        <section class="callout">${state.n ? N(4) : ""}<h4>Werte</h4><div class="strip" style="padding:10px 0"><div class="mono sub">0000060C</div></div></section>
        <section class="callout">${state.n ? N(2) : ""}<h4>Sender-IDs</h4><div class="strip"><table>${D.senders.map((s) => `<tr><td>${s[0]}</td><td class="mono">${s[1]}</td><td>${s[2]}</td><td>${s[3] ? `<span class="tag ok">${s[3]}</span>` : ""}</td></tr>`).join("")}</table></div></section>
        <section><h4>Einstellungen</h4><div class="strip"><table>${D.settings.map((s) => `<tr><td>${s[0]}</td><td class="mono">${s[1]}</td></tr>`).join("")}</table></div></section>
        <section class="callout">${state.n ? N(6) : ""}<h4>Entitäten (4)</h4><div class="strip"><table>${D.ents.map((e) => `<tr><td>${e[0]}</td><td class="mono">${e[1]}</td><td>${e[2]}</td></tr>`).join("")}</table></div></section>
      </div>
    </div></div>`;
}

function newView() {
  const card = (k, v, cls = "", n = "") => `<div class="${cls} callout">${n}<dt>${k}</dt><dd>${v}</dd></div>`;
  const last = D.last.map((l, i) => card(D.last.length > 1 ? `Letztes Telegramm · ${l.rorg}` : "Letztes Telegramm",
    `<div>${esc(l.ago)} · ${esc(l.rorg)} · ${l.dbm} dBm</div><div class="raw"><span class="tag mono">${esc(l.bytes)}</span><span class="tag mono">Status ${esc(l.status)}</span></div><div class="sub">${l.text.map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(" · ")}</div>`, "wide", i === 0 && state.n ? N(1) : "")).join("");
  const rows = (list, foot = "") => `<div class="rows">${list.join("")}${foot}</div>`;
  return `<div class="card new">
    <div class="head"><span></span><span>Gerät</span><span>Typ</span><span class="h-area">Bereich</span><span class="r h-ent">Ent.</span><span>Werte</span><span class="r">Zuletzt gehört</span><span></span></div>
    <div class="row">
      <span class="c-sel"><input type="checkbox" aria-label="auswählen"></span>
      <div class="ident callout">${state.n ? N(5) : ""}<span class="tile-kind">${plug}</span><div class="idtext"><span class="name" title="${esc(D.name)}">${esc(D.name)}</span><span class="sub"><span class="mono">${D.id}</span> · ${D.model}</span><span class="sub msub">${D.area} · ${D.entities} Entitäten</span></div></div>
      <span class="c-type"><span class="tag mono">${D.eep}</span></span><span class="c-area">${D.area}</span><span class="c-ent r">${D.entities}</span>
      <span class="values"><span class="pill">aktiv</span> <b>Ein</b> · 6 W</span>
      <div class="heard"><span class="l1">${D.heard} ${bars(D.dbm)} <span class="mono">${D.dbm} dBm</span></span><span class="l2">${D.count.toLocaleString("de-DE")} Telegramme · ${D.perMin}/min</span></div>
      <div class="acts"><button class="ibtn" aria-label="Mehr">${more}</button><button class="ibtn" aria-label="Zuklappen" aria-expanded="true">${chev}</button></div>
      <div class="detail">
        <section class="callout">${state.n ? N(6) : ""}<h4>Identität</h4><dl class="cards callout">${state.n ? N(3) : ""}
          ${card("Modell", `<select class="mini" aria-label="Modell">${D.models.map((m) => `<option${m === D.model ? " selected" : ""}>${m}</option>`).join("")}</select>`)}
          ${card("EEP", `<span class="tag mono">${D.eep}</span>`)}${card("Bereich", D.area)}${card("Gateway", esc(D.gateway))}${card("ID", `<span class="tag mono">${D.id}</span>`)}</dl></section>
        <section><h4>Funk</h4><dl class="cards">
          ${card("Zuletzt gehört", D.heard)}${card("Signal", `${D.dbm} dBm <span class="sub">${D.min} bis ${D.max}</span>`)}${card("Repeater-Stufen", D.repeat)}${card("Telegramme seit Start", D.telegrams)}
          ${last}</dl></section>
        <section class="callout">${state.n ? N(4) : ""}<h4>Letzte Werte <span class="sub">aus den Telegrammen gelesen</span></h4>${rows(D.values.map(([k, v, from]) => `<div class="li value"><span class="k">${k}</span><span class="sub">${from}</span><b>${v}</b></div>`), `<div class="foot"><span class="sub">Rohdaten</span><span class="tag mono">VLD 04 60 E4</span><span class="tag mono">4BS 00 00 06 0C</span><span class="tag mono">Status 00</span></div>`)}</section>
        <section class="callout">${state.n ? N(2) : ""}<h4>Sender-IDs <span class="sub">2</span></h4>${rows(D.senders.map((s) => `<div class="li"><span>${s[0]}</span><span><span class="tag mono">${s[1]}</span> <span class="sub">${s[2]}</span></span><span>${s[3] ? `<span class="tag ok">${s[3]}</span>` : '<span class="sub">nicht getestet</span>'}</span></div>`), `<div class="foot"><button class="chip text">Sender testen</button></div>`)}</section>
        <section><h4>Einstellungen</h4>${rows(D.settings.map((s) => `<div class="li"><span class="k">${s[0]}</span><span></span><b>${s[1]}</b></div>`))}</section>
        <section><h4>Entitäten <span class="sub">4</span></h4>${rows(D.ents.map((e) => `<div class="li"><span>${e[0]}</span><span class="mono sub" style="overflow-wrap:anywhere">${e[1]}</span><b>${e[2]}</b></div>`))}</section>
        <section><h4>Notiz</h4><input class="notefield" placeholder="z. B. Steckdose hinter dem Kühlschrank" aria-label="Notiz"></section>
        <div class="acts-row"><button class="chip">Gerät öffnen</button><button class="chip">Telegramme zeigen</button><button class="chip">Einlernen</button></div>
      </div>
    </div></div>`;
}

function render() {
  document.getElementById("frame").className = `frame${state.w === "phone" ? " phone" : ""}${state.n ? "" : " hide-nums"}`;
  document.getElementById("app").innerHTML = (state.v === "old" ? oldView() : newView()) + `<p class="note">${state.v === "old"
    ? "Vorher: 1 Letztes Telegramm so schmal wie Repeater-Stufen, Status bricht um · 2 Karten oben, Streifen ohne Innenabstand unten · 3 Modell-Kachel höher · 4 Werte nur Hex · 5 Name bricht um, drei Textgrößen bei Zuletzt gehört · 6 schwache Überschriften."
    : "Nachher: 1 Letztes Telegramm über 2 Spalten, Rohbytes und Status als Monospace-Tags · 2 eine Zeilenkomponente (Innenabstand, feste Spalten) · 3 Karten je Zeile gleich hoch, Auswahl ohne Zusatzzeile · 4 Zustand und Leistung aus den EEP-Daten, Rohdaten darunter · 5 Name einzeilig mit Tooltip, Zuletzt gehört in zwei Zeilen · 6 Überschriften mit Akzentstrich, Raster auto-fit ab 220 px."}</p>`;
  document.querySelectorAll("[data-v]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.v));
  document.querySelectorAll("[data-w]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.w === state.w));
  document.querySelectorAll("[data-n]").forEach((b) => b.setAttribute("aria-pressed", (b.dataset.n === "on") === state.n));
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.v) state.v = b.dataset.v;
  else if (b.dataset.w) state.w = b.dataset.w;
  else if (b.dataset.n) state.n = b.dataset.n === "on";
  else if (b.dataset.t) {
    if (b.dataset.t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", b.dataset.t);
    document.querySelectorAll("[data-t]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    return;
  } else return;
  render();
});
render();
</script>
</body>
</html>
