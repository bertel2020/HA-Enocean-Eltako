capture:
  fields:
    duration:
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    config_entry_id:
      selector:
        config_entry:
          integration: enocean_eltako

calibrate_cover:
  target:
    entity:
      integration: enocean_eltako
      domain: cover
  fields:
    only_if_inaccurate:
      default: false
      selector:
        boolean:

add_energy_devices:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: enocean_eltako

export_custom_devices:
  fields:
    ids:
      selector:
        object:

import_custom_devices:
  fields:
    yaml:
      required: true
      selector:
        text:
          multiline: true
    overwrite:
      default: false
      selector:
        boolean:
