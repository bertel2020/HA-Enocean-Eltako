name: Device request / Geräteanfrage
description: A device is not recognised or not supported yet / Ein Gerät wird nicht erkannt oder noch nicht unterstützt
labels: [device]
body:
  - type: input
    id: device
    attributes:
      label: Device / Gerät
      description: Manufacturer, model and, if known, the profile (EEP) from the data sheet.
      placeholder: "Eltako FBH65, A5-08-01 ..."
    validations:
      required: true
  - type: textarea
    id: telegrams
    attributes:
      label: Telegrams / Telegramme
      description: In the panel, open an unknown sender's telegram and use **Report device**. Sender IDs, gateway and times are replaced before the lines are copied. Paste them here.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the device does / Was das Gerät macht
      description: For example what you pressed or changed while the telegrams were recorded.
