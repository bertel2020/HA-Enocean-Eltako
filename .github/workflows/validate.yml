name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
      - name: Install test requirements
        run: uv pip install --system -r requirements_test.txt
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Type check (mypy strict)
        run: mypy
      - name: Protocol layer import check
        run: python scripts/check_protocol_imports.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
      - name: Install test requirements
        run: uv pip install --system -r requirements_test.txt
      - name: Cache official EEP definitions
        uses: actions/cache@v6
        with:
          path: .eep_cache
          key: eep-cache-${{ hashFiles('scripts/fetch_eep.py') }}
      - name: Fetch official EEP definitions (not committed, see NOTICE)
        run: python scripts/fetch_eep.py --generated
      - name: Generated EEP profiles up to date
        run: python scripts/generate_eep.py --check
      - name: Device docs up to date
        run: python scripts/gen_device_docs.py --check
      - name: Run tests
        run: python -m pytest -q -n auto --cov=custom_components/enocean_eltako --cov-fail-under=95

  panel:
    name: Panel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Panel files load, texts complete in en and de
        run: node scripts/check_panel.mjs
      - name: Install happy-dom (simulated browser for the render check)
        run: npm install --no-save --no-package-lock @happy-dom/global-registrator@20.14.6
      - name: Panel renders every view in en and de
        run: node scripts/check_panel_render.mjs

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # The HACS action can only validate public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
