name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Protocol layer import check
        run: python scripts/check_protocol_imports.py
      - name: Run tests
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository
        uses: hacs/action@main
        with:
          category: integration
          # No brand assets yet; added before the first release.
          ignore: brands
