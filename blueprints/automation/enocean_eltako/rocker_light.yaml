blueprint:
  name: EnOcean Eltako - rocker switches and dims a light
  description: >-
    Short press up turns the light on, short press down turns it off. Long press
    up or down changes the brightness by the given step.
  domain: automation
  source_url: https://github.com/bertel2020/HA-Enocean-Eltako/blob/main/blueprints/automation/enocean_eltako/rocker_light.yaml
  input:
    up_button:
      name: Button up
      selector:
        entity:
          filter:
            - integration: enocean_eltako
              domain: event
    down_button:
      name: Button down
      selector:
        entity:
          filter:
            - integration: enocean_eltako
              domain: event
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
    step:
      name: Brightness step
      default: 20
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: "%"

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input up_button
    id: up
  - trigger: state
    entity_id: !input down_button
    id: down

variables:
  step: !input step
  gesture: "{{ trigger.to_state.attributes.event_type | default('') }}"

conditions:
  - condition: template
    value_template: "{{ gesture in ['short_press', 'long_press'] }}"

actions:
  - choose:
      - conditions: "{{ trigger.id == 'up' and gesture == 'short_press' }}"
        sequence:
          - action: light.turn_on
            target: !input light_target
      - conditions: "{{ trigger.id == 'down' and gesture == 'short_press' }}"
        sequence:
          - action: light.turn_off
            target: !input light_target
      - conditions: "{{ gesture == 'long_press' }}"
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: "{{ step if trigger.id == 'up' else -step }}"
